name: 🔄 Sincronizar com repositório original

on:
  # Permite rodar manualmente
  workflow_dispatch:
  # Roda toda segunda-feira às 02:00 UTC para pegar atualizações do repositório original
  schedule:
    - cron: '0 2 * * 1'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout do fork (histórico completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔗 Adicionar repositório original como upstream
        run: git remote add upstream https://github.com/iptv-org/epg.git

      - name: 📡 Buscar atualizações do upstream
        run: git fetch upstream

      - name: 🔀 Mesclar mudanças do upstream
        run: |
          # Mescla as atualizações do repositório original
          # Mantém os arquivos locais em caso de conflito (strategy ours)
          git merge upstream/master --no-edit -X ours || {
            echo "Merge com conflitos. Resolvendo manualmente..."
            # Em caso de conflito, força manutenção dos nossos arquivos customizados
            git checkout HEAD -- meus_canais.channels.xml meus_canais2.channels.xml xml_para_json.py guide.xml guide.json 2>/dev/null || true
            git add -A
            git commit -m "chore: sincronizar com upstream (mantendo arquivos customizados)"
          }

      - name: 📤 Enviar ao fork no GitHub
        run: git push origin HEAD
