name: 🌐 Publicar guide.json no GitHub Pages

on:
  workflow_run:
    workflows: ["📺 Grab EPG - Meus Canais"]
    types:
      - completed
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: 📂 Preparar pasta para Pages
        run: |
          mkdir -p _site
          cp guide.json _site/guide.json
          cp guide.xml _site/guide.xml
          cp CNAME _site/CNAME

      - name: ⚙️ Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: 📤 Enviar para Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 🚀 Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
